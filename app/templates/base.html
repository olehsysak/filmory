<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Filmory{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <!-- Base -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">

    <!-- Components -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/hero.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/search.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/filters.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/list-card.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<header class="navbar">
    <div class="navbar__container">

        <a href="/" class="navbar__logo">Filmory</a>

        <nav class="navbar__nav">
            <a href="/films" class="nav-link">Films</a>

            <div class="nav-dropdown">
                <button class="nav-link nav-link--arrow">Collection ▾</button>
                <div class="nav-dropdown__menu">

                    <p class="nav-dropdown__group-label">Status</p>
                    <a href="/collection?tab=want_to_watch" class="nav-dropdown__item">
                        Want to watch
                    </a>
                    <a href="/collection?tab=watching" class="nav-dropdown__item">
                        Watching
                    </a>
                    <a href="/collection?tab=completed" class="nav-dropdown__item">
                        Completed
                    </a>
                    <a href="/collection?tab=dropped" class="nav-dropdown__item">
                        Dropped
                    </a>

                    <div class="nav-dropdown__divider"></div>

                    <p class="nav-dropdown__group-label">Favorites</p>
                    <a href="/collection?tab=favorites" class="nav-dropdown__item">
                        Favorites
                    </a>

                    <div class="nav-dropdown__divider"></div>

                    <p class="nav-dropdown__group-label">Lists</p>
                    <a href="#" class="nav-dropdown__item nav-dropdown__item--disabled">
                        My Lists
                    </a>

                </div>
            </div>

        </nav>

        <div class="navbar__actions">
            <form class="search-form" id="searchForm" onsubmit="return false;">
                <div class="search-form__field">
                    <input
                        type="text"
                        class="search-form__input"
                        id="searchInput"
                        placeholder="Search films & people..."
                        autocomplete="off"
                    >
                    <button type="button" class="search-form__btn" id="searchSubmitBtn">⌕</button>
                </div>
                <div class="search-form__suggestions" id="searchSuggestions" style="display:none"></div>
            </form>

            <div class="auth" id="authBlock">
                <a href="/login" class="btn btn--outline">Login</a>
                <a href="/register" class="btn btn--primary">Register</a>
            </div>

            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span class="theme-toggle__icon">☀</span>
            </button>
        </div>

    </div>
</header>

<main class="main">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer__container">
        <p class="footer__text">Filmory © 2026 · Powered by <a href="https://www.themoviedb.org" target="_blank">TMDB</a></p>
    </div>
</footer>

<script src="{{ url_for('static', path='js/theme.js') }}"></script>
<script src="{{ url_for('static', path='js/index.js') }}"></script>
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
<script src="{{ url_for('static', path='js/navbar-search.js') }}"></script>
<script src="{{ url_for('static', path='js/utils/list-card.js') }}"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
